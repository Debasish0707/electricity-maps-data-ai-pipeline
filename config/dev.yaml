source:
  base_url: "https://api.electricitymaps.com/v4"
  api_key_env: "ELECTRICITY_MAPS_API_KEY"
  zone: "FR"
  temporal_granularity: "hourly"
  timeout_seconds: 30
  max_retries: 4
  backoff_seconds: 1.0
  flow_positive_direction: "inbound"
storage:
  bronze: "output/bronze"
  silver: "output/silver"
  gold: "output/gold"
  checkpoint: "output/checkpoints"
quality:
  mix_percentage_tolerance: 0.5
processing:
  interval_hours: 1.0
